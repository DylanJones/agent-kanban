[package]
name = "agent-kanban"
version = "0.1.0"
edition = "2024"
default-run = "agent-kanban"

[dependencies]
agent-client-protocol = { version = "2.2.0", features = ["unstable_end_turn_token_usage"] }
anyhow = "1"
async-stream = "0.3"
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.12", features = ["cookie", "typed-header"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4.6", features = ["derive", "env"] }
futures = "0.3"
hex = "0.4"
mime_guess = "2"
minijinja = "2"
getrandom = "0.3"
regex = "1"
rust-embed = { version = "8.12", features = ["include-exclude"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio", "chrono", "json", "macros", "migrate", "derive"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["compat", "rt"] }
toml = "0.9"
tower-http = { version = "0.7", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "6", features = ["axum_extras", "chrono"] }
utoipa-axum = "0.3"
utoipa-scalar = { version = "0.4", features = ["axum"] }
dirs = "6"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"


# The system `strip` on this macOS version corrupts proc-macro dylibs ("mis-aligned LINKEDIT
# string pool"), and release builds strip debuginfo by default. Keep build deps unstripped.
[profile.release.build-override]
strip = "none"
debug = false
