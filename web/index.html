<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f6f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b0e" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Kanban" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>agent-kanban</title>
    <script>
      // Applies the persisted theme before first paint, so there's no flash of the wrong theme.
      // Keep in sync with THEME_STORAGE_KEY / applyTheme in src/theme.ts.
      (function () {
        var v = null;
        try {
          v = localStorage.getItem("akb-theme");
        } catch (e) {}
        var pref = v === "light" || v === "dark" ? v : "system";
        var dark = pref === "dark" || (pref === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
